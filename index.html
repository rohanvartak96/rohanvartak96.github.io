/* ---- Hero phrase rotator (ported from prototype.html) ----------------------
   The slot is a fixed-height window (overflow:hidden) that phrases roll through,
   so the line below it never shifts. Each phrase is a layer at inset:0, and every
   glyph animates on its own timeline: rises from below the window, holds, exits
   through the top. Adjacent phrases are offset by exactly one beat (--d), so glyph
   i of the old phrase leaves as glyph i of the new one arrives — one continuous roll.

   The per-glyph offset is centre-out (--s = |i - (n-1)/2|), not left-to-right, and
   that is a timing decision as much as a stylistic one: a left-to-right sweep would
   spread "Strategic analysis" (18 glyphs) over 0.60s while "ML models" finished in
   0.28s, and the long phrase would visibly drag. Centre-out halves the max offset
   (0.14s to 0.30s across the four). --stagger is the ripple-intensity knob.

   content-box is load-bearing against the global border-box reset above. Vertical
   padding must stay 0: overflow clips at the *padding* box, so padding-top/bottom
   would widen the window past one cell and leak the next phrase's ascenders in.

   padding-LEFT is the exception, and it is required. Playfair italic glyphs carry a
   negative left side bearing — their ink starts left of the inline-block origin, by
   up to 0.09em (the A of "AI agents" at 67px overhangs 6px). With the slot clipping
   at x=0 that sliver was being shaved off. Padding the clip box out and pulling it
   back with an equal negative margin keeps the ink whole and the text still optically
   flush with the headline above. Both values must stay in lockstep.

   --cell is both the glyph travel distance (translateY 100% of the inline-block box,
   i.e. its line-height) and the window height. 1.4em is a floor, not a preference:
   Playfair italic 800 descenders (the g/y in "Strategic analysis", p in "pipelines")
   overhang far enough that at 1.2em their tips poke through the top of the window
   while the next phrase is resting. Don't tighten it without re-checking that. */
.rot-slot { --cell: 1.4em; --stagger: 0.035s; --bleed: 0.14em; box-sizing: content-box;
  display: block; position: relative; overflow: hidden; height: var(--cell); max-width: 100%;
  padding: 0 0 0 var(--bleed); margin-left: calc(-1 * var(--bleed)); }
/* left: var(--bleed), NOT 0. An absolutely-positioned box resolves inset against its
   containing block's PADDING box, so inset:0 would park the phrase at the padding edge
   and the --bleed gutter below would shift the text left of the headline instead of
   widening the clip region around it. */
.rot-slot .rot-phrase { position: absolute; top: 0; right: 0; bottom: 0; left: var(--bleed);
  white-space: nowrap; line-height: var(--cell); }
/* inline-block so translateY applies at all — inline boxes ignore transforms.
   fill-mode backwards is load-bearing: during its --d delay a glyph would otherwise
   sit at its untransformed position, so all four phrases would render stacked on top
   of one another until their animations began. backwards parks them below the window. */
.rot-slot i { display: inline-block; font-style: inherit;
  animation: heroRoll 11.2s infinite backwards cubic-bezier(0.76, 0, 0.24, 1);
  animation-delay: calc(var(--d) + var(--s) * var(--stagger)); }
/* 4% ≈ 0.45s to rise, held to 25% (2.8s), 4% to leave, then parked above the window
   for the other three beats. The 100% → 0% wrap jumps -100% to +100%, both clipped.
   These percentages assume 4 phrases at one quarter of the cycle each. */
@keyframes heroRoll {
  0%        { transform: translateY(100%); }
  4%, 25%   { transform: translateY(0); }
  29%, 100% { transform: translateY(-100%); }
}
@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  /* Without this the glyphs would still animate. Pin phrase one, hide the rest —
     never leave them all at their untransformed position, i.e. stacked. */
  .rot-slot i { animation: none; transform: none; }
  .rot-slot .rot-phrase { opacity: 0; }
  .rot-slot .rot-phrase:first-child { opacity: 1; }
}
/* Fallback for engines without container-query units (pre-2023 Chrome/Safari/Firefox).
   The rotator's font-size is set inline as min(clamp(...), 12.5cqw); if cqw is
   unparseable the browser discards that whole declaration and the element would fall
   back to the inherited 16px. This rule catches it. It is deliberately smaller than
   the cqw-capped size so the longest phrase cannot clip at any width. */
.rot-size { font-size: clamp(30px, 7.5vw, 59px); }
/* Screen-reader-only: the rotator itself is aria-hidden, so the phrase list is
   exposed here as static text instead of a word that mutates under the reader. */
.vh { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }

const ThemeCtx = React.createContext(false);
function useC() { const dark = React.useContext(ThemeCtx); return dark ? CD : C; }

function useInView(ref, threshold = 0.1) {
  const [visible, setVisible] = useState(false);
  useEffect(() => {
    if (!ref.current) return;
    const obs = new IntersectionObserver(([e]) => { if (e.isIntersecting) { setVisible(true); obs.disconnect(); } }, { threshold });
    obs.observe(ref.current);
    return () => obs.disconnect();
  }, []);
  return visible;
}

function useCounter(target, visible, duration = 1200) {
  const [val, setVal] = useState(0);
  useEffect(() => {
    if (!visible) return;
    let start = null;
    const step = (ts) => {
      if (!start) start = ts;
      const p = Math.min((ts - start) / duration, 1);
      const ease = 1 - Math.pow(1 - p, 3);
      setVal(Math.round(ease * target));
      if (p < 1) requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  }, [visible, target]);
  return val;
}

function useWindowWidth() {
  const [width, setWidth] = useState(typeof window !== 'undefined' ? window.innerWidth : 1200);
  useEffect(() => {
    const fn = () => setWidth(window.innerWidth);
    window.addEventListener('resize', fn);
    return () => window.removeEventListener('resize', fn);
  }, []);
  return width;
}

function hPad(w) {
  if (w < 768) return '20px';
  if (w < 1024) return '32px';
  return 'max(56px, calc((100vw - 1280px) / 2))';
}

          <a href="#contact" onClick={() => setMenuOpen(false)} style={{ background: ACC, color: '#fff', borderRadius: 100, padding: '12px 24px', fontSize: 14, fontWeight: 600, textDecoration: 'none', textAlign: 'center', marginTop: 8 }}>Get in Touch</a>

}

const ROLES = ['ML models', 'Data pipelines', 'AI agents', 'Strategic analysis'];

// Must match the heroRoll keyframes, which divide the cycle into ROLES.length beats.
// Changing the phrase count means re-deriving the 4%/25%/29% stops in the CSS.
const ROT_CYCLE = 11.2;

// Emits one absolutely-positioned layer per phrase, one <i> per glyph. --s is the
// centre-out offset |i - (n-1)/2|, which depends on phrase length — deriving it here
// rather than hand-authoring it means editing a phrase can never skew its ripple.
function RotatingPhrases({ phrases }) {
  const beat = ROT_CYCLE / phrases.length;
  return (
    <span className="rot-slot" aria-hidden="true">
      {phrases.map((phrase, p) => (
        <span key={phrase} className="rot-phrase" style={{ '--d': `${(p * beat).toFixed(2)}s` }}>
          {Array.from(phrase).map((ch, i) => (
            <i key={i} style={{ '--s': String(Math.abs(i - (phrase.length - 1) / 2)) }}>
              {/* NBSP, not a space: each <i> is inline-block, i.e. its own block
                  container, so a plain space would be stripped as leading/trailing
                  whitespace and the phrase would render as "MLmodels". */}
              {ch === ' ' ? '\u00A0' : ch}
            </i>
          ))}
        </span>
      ))}
    </span>
  );
}

      <div style={{ position: 'absolute', inset: 0, backgroundImage: `radial-gradient(circle, ${C.border} 1px, transparent 1px)`, backgroundSize: '28px 28px', pointerEvents: 'none', opacity: 0.6 }}></div>

      {/* containerType makes this column a query container so the rotator below can
          cap its font-size in cqw. The column — not the viewport — is the real

            <span style={{ fontFamily: 'DM Sans', fontSize: 12.5, fontWeight: 600, letterSpacing: '0.02em', color: GREEN }}>Open to ML / DS Roles</span>
          </span>
        </div>

        <h1 style={{ fontFamily: 'Playfair Display, serif', fontWeight: 900, fontSize: isMobile ? 'clamp(45px, 11vw, 59px)' : 'clamp(49px, 5vw, 67px)', lineHeight: 1.0, letterSpacing: '-0.025em', color: C.ink, marginBottom: 4 }}>
          Hi, I'm Rohan.<br />I build
        </h1>
        <div className="rot-size" style={{
          fontFamily: 'Playfair Display, serif',
          fontWeight: 800,
          fontStyle: 'italic',
          // The roll needs white-space:nowrap, so a phrase too wide for the mask gets
          // its tail clipped rather than wrapped — "Strategic analysis" lost its final
          // "s" at 375px. 12.5cqw caps the type at column-width/8, and 8 is the measured
          // px-of-width per px-of-font-size for the longest phrase (7.82) plus headroom.

// Inline data-viz cover band for professional cards, ported from prototype.html's
// .figband. The prototype's argument is that a work card should lead with the
// measurement rather than a stock screenshot, so each chart states that project's
// headline result in its own units.
//
// IBM Plex Mono (the prototype's choice) is not loaded on this page; rather than add
// a webfont request for a handful of chart labels, these fall back to the system mono
// stack. Numerals are tabular so figures stay column-aligned.
const MONO = 'ui-monospace, SFMono-Regular, Menlo, monospace';

function FigBand({ kind }) {
  const C = useC();
  const ref = useRef(null);
  const visible = useInView(ref);

  const axis  = { stroke: C.borderMid, strokeWidth: 1 };
  const tick  = { fill: C.inkLight, fontFamily: MONO, fontSize: 8.5, fontWeight: 500 };
  const val   = { fill: C.ink, fontFamily: MONO, fontSize: 12, fontWeight: 600 };
  const track = { fill: C.border };
  const dot   = { fill: ACC };
  const whisk = { stroke: ACC, strokeWidth: 1.5 };
  const thresh = { stroke: C.ink, strokeWidth: 1.25, strokeDasharray: '3 3' };
  // Bars fill from the left when the card scrolls in; transform-origin keeps it
  // reading as "filling up" rather than scaling out from the middle.
  const grow = { fill: ACC, transformOrigin: 'left center',
    transform: visible ? 'scaleX(1)' : 'scaleX(0)', transition: 'transform 1s cubic-bezier(0.22,1,0.36,1)' };

  const CHARTS = {
    region: {
      caption: 'Per-state precision, GPS-grounded eval · CIs <0.5%',
      svg: (
        <svg viewBox="0 0 300 74" role="img" style={{ width: '100%', height: 'auto', display: 'block', overflow: 'visible' }}
          aria-label="Per-state precision: California 96.85% plus or minus 0.01%, Texas 96.16% plus or minus 0.02%. The legal precision floor is 95%.">
          <line style={axis} x1="0" y1="60" x2="300" y2="60" />
          <line style={thresh} x1="96" y1="6" x2="96" y2="60" />
          <text style={tick} x="96" y="71" textAnchor="middle">95% floor</text>
          <text style={tick} x="298" y="71" textAnchor="end">97%</text>
          <g>
            <line style={whisk} x1="238" y1="20" x2="248" y2="20" />
            <circle style={dot} cx="243" cy="20" r="4" />
            <text style={val} x="228" y="24" textAnchor="end">CA 96.85%</text>
          </g>
          <g>
            <line style={whisk} x1="219" y1="44" x2="233" y2="44" />
            <circle style={dot} cx="226" cy="44" r="4" />
            <text style={val} x="210" y="48" textAnchor="end">TX 96.16%</text>
          </g>
        </svg>
      ),
    },
    latency: {
      caption: 'TTRC% — the metric I defined for this work',
      svg: (
        <svg viewBox="0 0 300 74" role="img" style={{ width: '100%', height: 'auto', display: 'block', overflow: 'visible' }}
          aria-label="Time To Responsive Content: 40 percent of page loads completed within one second at baseline, 60 percent did not.">
          <rect style={track} x="0" y="16" width="300" height="20" rx="4" />
          <rect style={grow} x="0" y="16" width="120" height="20" rx="4" />
          <line style={thresh} x1="120" y1="8" x2="120" y2="44" />
          <text style={val} x="0" y="60">40%</text>
          <text style={tick} x="36" y="60">of loads under 1s (baseline)</text>
          <text style={tick} x="300" y="60" textAnchor="end">100%</text>
        </svg>
      ),
    },
    // The prototype's third band claimed "95% recall at the operating point". That
    // figure appears nowhere in projects/user-language-model.html — the page's only
    // stated result is the +0.03% experiment lift — so this chart shows that instead.
    // Same dot-and-whisker vocabulary as the region band, against a zero baseline.
    language: {
      caption: 'Revenue lift in experiment · CI excludes zero',
      svg: (
        <svg viewBox="0 0 300 74" role="img" style={{ width: '100%', height: 'auto', display: 'block', overflow: 'visible' }}
          aria-label="Revenue lift in experiment: plus 0.03 percent, statistically significant — the confidence interval sits entirely above zero.">
          <line style={axis} x1="0" y1="60" x2="300" y2="60" />
          <line style={thresh} x1="120" y1="6" x2="120" y2="60" />
          <text style={tick} x="120" y="71" textAnchor="middle">0% (control)</text>
          <text style={tick} x="298" y="71" textAnchor="end">interval, not to scale</text>
          {/* The estimate sits just right of zero on purpose. A true linear axis would
              put a +0.03% effect on top of the zero line and render it unreadable, so
              this is a schematic of the test result — the point that carries meaning is
              that the whisker never crosses zero. The tick says so rather than implying
              a magnitude the geometry cannot honestly convey. */}
          <g>
            <line style={whisk} x1="150" y1="32" x2="186" y2="32" />
            <circle style={dot} cx="168" cy="32" r="4" />
            <text style={val} x="196" y="36">+0.03%</text>
          </g>
        </svg>
      ),
    },
  };

  const chart = CHARTS[kind];
  if (!chart) return null;
  return (
    <figure ref={ref} style={{ background: C.creamDark, borderBottom: `1px solid ${C.border}`, padding: '16px 22px 13px', flexShrink: 0 }}>
      {chart.svg}
      <figcaption style={{ fontFamily: MONO, fontSize: 11.5, fontWeight: 500, letterSpacing: '0.02em',
        color: C.inkLight, marginTop: 9, fontVariantNumeric: 'tabular-nums' }}>{chart.caption}</figcaption>
    </figure>
  );
}

// Wraps the `bold` phrase of a quote in a heavier, darker span. Returns the quote
// untouched if the phrase is absent, so a copy edit can never drop text.
function emphasize(text, phrase, C) {
  const i = phrase ? text.indexOf(phrase) : -1;
  if (i === -1) return text;
  return [
    text.slice(0, i),
    <strong key="b" style={{ fontWeight: 600, color: C.ink }}>{phrase}</strong>,
    text.slice(i + phrase.length),
  ];
}

function App() {
  const [dark, setDark] = useState(() => { try { return localStorage.getItem('theme') === 'dark'; } catch(e) { return false; } });

  useEffect(() => {
    try { localStorage.setItem('theme', dark ? 'dark' : 'light'); } catch(e) {}
    document.documentElement.classList.toggle('dark', dark);
  }, [dark]);

  useEffect(() => {
    const hash = window.location.hash;
    if (!hash) return;
    requestAnimationFrame(() => {
      const el = document.querySelector(hash);
      if (el) el.scrollIntoView({ behavior: 'instant' });
    });
  }, []);

  const bg = dark ? CD.cream : C.cream;
  return (
    <ThemeCtx.Provider value={dark}>
      <div style={{ background: bg, transition: 'background 0.25s ease' }}>
        <Nav dark={dark} setDark={setDark} />
        <Hero />
        <AboutStrip />
        <StatStrip />
        <Projects />
        <Skills />
        <Testimonials />
        <Contact />
        <Footer />
      </div>
    </ThemeCtx.Provider>
  );
}
